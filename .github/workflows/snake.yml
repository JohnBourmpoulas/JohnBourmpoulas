name: Generate contribution signal

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JohnBourmpoulas
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#42def4&color_dots=#070b10,#0d1b22,#12313c,#185063,#42def4

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
