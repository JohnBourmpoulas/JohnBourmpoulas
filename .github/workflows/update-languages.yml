name: Update language telemetry

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate project-based language telemetry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_languages.py

      - name: Commit refreshed telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/languages.svg

          if git diff --cached --quiet; then
            echo "No telemetry changes."
          else
            git commit -m "Refresh language telemetry"
            git push
          fi
