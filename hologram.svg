<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1118"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ff6ff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#00d9ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#0ec7e8" stroke-width="0.4" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- subtle horizon -->
  <line x1="80" y1="210" x2="1120" y2="210" stroke="#1dbed9" stroke-width="0.6" opacity="0.16"/>
  <line x1="600" y1="54" x2="600" y2="366" stroke="#1dbed9" stroke-width="0.6" opacity="0.13"/>

  <!-- central holographic core -->
  <circle cx="600" cy="210" r="54" fill="url(#core)" filter="url(#softGlow)">
    <animate attributeName="r" values="48;58;48" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating rings -->
  <g fill="none" stroke="#00d9ff" stroke-linecap="round">
    <ellipse cx="600" cy="210" rx="104" ry="38" stroke-width="1.2" opacity="0.72" stroke-dasharray="18 10 4 10">
      <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="210" rx="104" ry="38" stroke-width="0.8" opacity="0.28" transform="rotate(60 600 210)" stroke-dasharray="10 12">
      <animateTransform attributeName="transform" type="rotate" from="60 600 210" to="-300 600 210" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="210" rx="104" ry="38" stroke-width="0.8" opacity="0.28" transform="rotate(-60 600 210)" stroke-dasharray="7 13">
      <animateTransform attributeName="transform" type="rotate" from="-60 600 210" to="300 600 210" dur="17s" repeatCount="indefinite"/>
    </ellipse>

    <circle cx="600" cy="210" r="128" stroke-width="0.7" opacity="0.18" stroke-dasharray="2 8"/>
    <circle cx="600" cy="210" r="154" stroke-width="0.55" opacity="0.10" stroke-dasharray="1 12"/>

    <path d="M600 56 A154 154 0 0 1 754 210" stroke-width="1.2" opacity="0.48" stroke-dasharray="28 8">
      <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="22s" repeatCount="indefinite"/>
    </path>

    <path d="M472 210 A128 128 0 0 1 600 82" stroke-width="1" opacity="0.34" stroke-dasharray="14 10">
      <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="-360 600 210" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- orbital points -->
  <g fill="#77efff" filter="url(#softGlow)">
    <circle cx="704" cy="210" r="3">
      <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="82" r="2.5" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="-360 600 210" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- scan beam -->
  <rect x="320" y="0" width="8" height="420" fill="url(#scan)" opacity="0.18">
    <animate attributeName="x" values="250;950;250" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- minimalist side telemetry -->
  <g stroke="#00d9ff" fill="none" opacity="0.26">
    <path d="M98 126h116m-116 16h82m-82 16h55" stroke-width="0.8"/>
    <path d="M1102 278H986m116 16h-82m82 16h-55" stroke-width="0.8"/>
  </g>

  <g fill="#00d9ff">
    <circle cx="98" cy="126" r="2.2" opacity="0.55">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1102" cy="278" r="2.2" opacity="0.55">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- outer brackets -->
  <g stroke="#00d9ff" fill="none" opacity="0.22" stroke-width="1">
    <path d="M66 76v-16h16"/>
    <path d="M1134 76v-16h-16"/>
    <path d="M66 344v16h16"/>
    <path d="M1134 344v16h-16"/>
  </g>

  <!-- faint pulse rings -->
  <circle cx="600" cy="210" r="80" fill="none" stroke="#66efff" stroke-width="0.8" opacity="0">
    <animate attributeName="r" values="70;145" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="210" r="80" fill="none" stroke="#66efff" stroke-width="0.6" opacity="0">
    <animate attributeName="r" values="70;145" begin="2.5s" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0" begin="2.5s" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
